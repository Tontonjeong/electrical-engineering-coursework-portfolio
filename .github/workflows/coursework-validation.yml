name: Coursework Validation and Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PPG_REPO_ROOT: ${{ github.workspace }}/.visual-dependencies/ppg-hrv
      RADAR_REPO_ROOT: ${{ github.workspace }}/.visual-dependencies/fmcw-radar
    steps:
      - uses: actions/checkout@v4

      - name: Checkout PPG-HRV visual dependency
        uses: actions/checkout@v4
        with:
          repository: Tontonjeong/PPG-HRV-Cognitive-Load-CNN
          ref: 3c6e6bcebbce000e7a1c3552a69aad6e030d527a
          path: .visual-dependencies/ppg-hrv
          sparse-checkout: docs
          persist-credentials: false

      - name: Checkout FMCW Radar visual dependency
        uses: actions/checkout@v4
        with:
          repository: Tontonjeong/fmcw-radar-aoac-cardiac-analysis
          ref: 86d97c55f21cf469e67de4acc0b91b43089de0c3
          path: .visual-dependencies/fmcw-radar
          sparse-checkout: docs
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install visual-audit dependencies
        run: python -m pip install --disable-pip-version-check numpy olefile pillow pypdf

      - name: Install open-source toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl g++

      - name: Run independent calculations
        run: python scripts/run_all_calculations.py

      - name: Build bilingual case-study site and README files
        run: python scripts/build_coursework_site.py

      - name: Test interactive calculators
        run: node scripts/test_calculators.mjs

      - name: Validate SVG viewport and text bounds
        run: python scripts/validate_svg_bounds.py

      - name: Audit privacy, publication boundaries, links and assets
        run: python scripts/validate_publication.py

      - name: Validate committed source-visual inventory
        run: python scripts/audit_all_visual_sources.py --validate-only

      - name: Validate exact and near-duplicate groups
        run: python scripts/detect_visual_duplicates.py

      - name: Validate minimum visual coverage
        run: python scripts/check_visual_coverage.py

      - name: Validate visual references, captions, and file integrity
        run: python scripts/check_visual_references.py

      - name: Build and execute portable C++ calculator
        run: |
          mkdir -p build/cpp
          g++ -std=c++17 -Wall -Wextra -pedantic \
            03_motor_control/dc_motor_pi_control/src/pi_gain_calculator_portable.cpp \
            -o build/cpp/pi_gain_calculator
          build/cpp/pi_gain_calculator

      - name: Analyze VHDL
        working-directory: 00_digital_hardware/controller_logic
        run: |
          mkdir -p build
          ghdl -a --std=08 --workdir=build \
            src/original/fulladd.vhd \
            src/original/add_4bits.vhd \
            src/original/mux_8to1.vhd \
            src/original/mealy_101.vhd \
            src/portable_reconstruction/dec_3to8.vhd \
            src/portable_reconstruction/mux_8to1_4bits.vhd \
            src/portable_reconstruction/usr_4bit.vhd \
            tb/tb_fulladd.vhd \
            tb/tb_add_4bits.vhd \
            tb/tb_dec_3to8.vhd \
            tb/tb_mux_8to1.vhd \
            tb/tb_mux_8to1_4bits.vhd \
            tb/tb_mealy_101.vhd \
            tb/tb_usr_4bit.vhd

      - name: Execute self-checking VHDL regression
        working-directory: 00_digital_hardware/controller_logic
        run: |
          set -euo pipefail
          for test in \
            tb_fulladd tb_add_4bits tb_dec_3to8 tb_mux_8to1 \
            tb_mux_8to1_4bits tb_mealy_101 tb_usr_4bit
          do
            ghdl -e --std=08 --workdir=build "$test"
            ghdl -r --std=08 --workdir=build "$test" \
              --assert-level=error --vcd="build/${test}.vcd"
          done

      - name: Upload VHDL waveforms
        uses: actions/upload-artifact@v4
        with:
          name: controller-logic-vcd
          path: 00_digital_hardware/controller_logic/build/*.vcd

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
