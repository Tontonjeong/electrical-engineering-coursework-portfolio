  <rect x="70" y="245" width="220" height="140" rx="18" class="box"/><text x="180" y="310" class="label"><tspan x="180" dy="0">ZL and Z₀</tspan></text><rect x="350" y="245" width="220" height="140" rx="18" class="box"/><text x="460" y="310" class="label"><tspan x="460" dy="0">Γ</tspan></text><rect x="630" y="245" width="220" height="140" rx="18" class="box"/><text x="740" y="310" class="label"><tspan x="740" dy="0">Return loss</tspan></text><rect x="910" y="245" width="220" height="140" rx="18" class="box"/><text x="1020" y="310" class="label"><tspan x="1020" dy="0">VSWR</tspan></text>
</svg>