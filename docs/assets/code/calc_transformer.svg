o&quot;,&quot;Consolas&quot;,&quot;SFMono-Regular&quot;,monospace" font-size="16" xml:space="preserve">REPORTED_REGULATION_PCT = 1.136</text><text x="48" y="552" fill="#475569" font-family="&quot;Cascadia Mono&quot;,&quot;Consolas&quot;,&quot;SFMono-Regular&quot;,monospace" font-size="16"> 16</text><text x="100" y="552" fill="#cbd5e1" font-family="&quot;Cascadia Mono&quot;,&quot;Consolas&quot;,&quot;SFMono-Regular&quot;,monospace" font-size="16" xml:space="preserve"></text><text x="48" y="580" fill="#475569" font-family="&quot;Cascadia Mono&quot;,&quot;Consolas&quot;,&quot;SFMono-Regular&quot;,monospace" font-size="16"> 17</text><text x="100" y="580" fill="#cbd5e1" font-family="&quot;Cascadia Mono&quot;,&quot;Consolas&quot;,&quot;SFMono-Regular&quot;,monospace" font-size="16" xml:space="preserve"></text><text x="48" y="608" fill="#475569" font-family="&quot;Cascadia Mono&quot;,&quot;Consolas&quot;,&quot;SFMono-Regular&quot;,monospace" font-size="16"> 18</text><text x="100" y="608" fill="#a5b4fc" font-family="&quot;Cascadia Mono&quot;,&quot;Consolas&quot;,&quot;SFMono-Regular&quot;,monospace" font-size="16" xml:space="preserve">def calculate() -&gt; dict[str, float | str]:</text><text x="48" y="636" fill="#475569" font-family="&quot;Cascadia Mono&quot;,&quot;Consolas&quot;,&quot;SFMono-Regular&quot;,monospace" font-size="16"> 19</text><text x="100" y="636" fill="#cbd5e1" font-family="&quot;Cascadia Mono&quot;,&quot;Consolas&quot;,&quot;SFMono-Regular&quot;,monospace" font-size="16" xml:space="preserve">    total_loss = COPPER_LOSS_W + CORE_LOSS_W</text><text x="48" y="664" fill="#475569" font-family="&quot;Cascadia Mono&quot;,&quot;Consolas&quot;,&quot;SFMono-Regular&quot;,monospace" font-size="16"> 20</text><text x="100" y="664" fill="#cbd5e1" font-family="&quot;Cascadia Mono&quot;,&quot;Consolas&quot;,&quot;SFMono-Regular&quot;,monospace" font-size="16" xml:space="preserve">    efficiency = 100.0 * OUTPUT_W / (OUTPUT_W + total_loss)</text><text x="48" y="688" fill=