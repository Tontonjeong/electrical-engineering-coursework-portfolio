<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">RF passive network portfolio</title>
  <desc id="desc">Four source-derived microwave design cases on an alumina microstrip substrate.</desc>
  <rect width="960" height="460" rx="36" fill="#0c1425"/>
  <text x="56" y="64" fill="#eef5ff" font-family="Arial" font-size="28" font-weight="700">RF/Microwave Passive Networks</text>
  <text x="56" y="99" fill="#9fb0c9" font-family="Arial" font-size="16">Alumina εr 9.9 · theory separated from Cadence result archive</text>
  <g font-family="Arial" text-anchor="middle">
    <g fill="#14233d" stroke="#8b7dff" stroke-width="2">
      <rect x="56" y="150" width="190" height="210" rx="20"/><rect x="275" y="150" width="190" height="210" rx="20"/>
      <rect x="494" y="150" width="190" height="210" rx="20"/><rect x="713" y="150" width="191" height="210" rx="20"/>
    </g>
    <g fill="#eef5ff">
      <text x="151" y="196" font-size="19" font-weight="700">Microstrip</text><text x="151" y="228" fill="#43d9ff" font-size="16">50 Ω · 270°</text>
