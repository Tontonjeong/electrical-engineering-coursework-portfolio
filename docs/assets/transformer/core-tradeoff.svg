<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">Transformer core trade study</title>
  <desc id="desc">DU, EI and UI core candidates compared by efficiency, regulation and window utilization.</desc>
  <rect width="960" height="460" rx="36" fill="#0c1425"/>
  <text x="56" y="64" fill="#eef5ff" font-family="Arial" font-size="28" font-weight="700">900 W Transformer · Core Trade Study</text>
  <text x="56" y="99" fill="#9fb0c9" font-family="Arial" font-size="16">220 V → 110 V · 300 Hz · Bmax 1.5 T</text>
  <g font-family="Arial">
    <g stroke="#243957"><line x1="105" y1="355" x2="890" y2="355"/><line x1="105" y1="145" x2="105" y2="355"/></g>
    <g fill="#61708a">
      <rect x="160" y="273" width="110" height="82" rx="8"/><rect x="355" y="216" width="110" height="139" rx="8"/>
      <rect x="550" y="263" width="110" height="92" rx="8"/><rect x="745" y="188" width="110" height="167" rx="8" fill="#43d9ff"/>
    </g>
    <g text-anchor="middle" fill="#eef5ff" font-size="16">
      <text x="215" y="260">95.985%</text><text x="410" y="203">96.264%</text>
      <text x="605" y="250">96.014%</text><text x="800" y="175" fill="#43d9ff" font-weight="700">96.360%</text>
      <text x="215" y="385">DU-75</text><text x="410" y="385">EI first</text><text x="605" y="385">EI redesign</text><text x="800" y="385">UI-100</text>
    </g>
    <rect x="730" y="116" width="140" height="34" rx="17" fill="#143a3d"/>
    <text x="800" y="139" text-anchor="middle" fill="#65f0ce" font-size="14" font-weight="700">SELECTED</text>
  </g>
</svg>
